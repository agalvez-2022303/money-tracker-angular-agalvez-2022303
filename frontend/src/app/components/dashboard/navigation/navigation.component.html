<nav class="nav" aria-label="Navegacion principal">
  <ol class="nav__lista">
    @for (opcion of opciones; track opcion.route) {
      <li class="nav__item">
        <a
          class="nav__enlace"
          [routerLink]="opcion.route"
          routerLinkActive="nav__enlace--activo"
          [routerLinkActiveOptions]="{ exact: opcion.exact ?? false }"
          [attr.aria-label]="opcion.label"
        >
          @switch (opcion.iconKey) {
            @case ('home') {
              <svg lucideHome class="nav__icono" size="20"></svg>
            }
            @case ('history') {
              <svg lucideHistory class="nav__icono" size="20"></svg>
            }
            @case ('stats') {
              <svg lucideBarChart3 class="nav__icono" size="20"></svg>
            }
            @case ('settings') {
              <svg lucideSettings class="nav__icono" size="20"></svg>
            }
          }
          <span class="nav__texto">{{ opcion.label }}</span>
        </a>
      </li>
    }
  </ol>
</nav>
